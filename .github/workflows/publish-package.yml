name: Publish Package

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@ksimonnet"

      - name: Preflight package auth
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ -n "$NODE_AUTH_TOKEN" ]] || (echo "GITHUB_TOKEN is empty." && exit 1)
          npm whoami --registry=https://npm.pkg.github.com >/dev/null || (
            echo "GITHUB_TOKEN cannot authenticate to GitHub Packages." &&
            echo "Check repository Settings > Actions > General > Workflow permissions = Read and write." &&
            exit 1
          )

      - name: Check if version already published
        id: version_check
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view @ksimonnet/likened-shared@$PACKAGE_VERSION version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already exists. Skipping publish."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        if: steps.version_check.outputs.already_published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

      - name: Publish permission guidance
        if: failure()
        run: |
          echo "If failure is E403 write_package, verify both settings:"
          echo "1. Repository Settings > Actions > General > Workflow permissions = Read and write"
          echo "2. Package Settings > Manage Actions access > KSimonnet/likened-shared has Write role"
          echo "   https://github.com/users/KSimonnet/packages/npm/package/likened-shared/settings"
